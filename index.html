<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HAR | Live Phone Stream</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-200 font-sans min-h-screen flex flex-col items-center justify-center p-6">

    <div class="max-w-md w-full bg-slate-900 border border-slate-800 rounded-3xl p-8 text-center shadow-2xl">
        
        <div id="statusDot" class="h-4 w-4 bg-red-500 rounded-full mx-auto mb-4 animate-pulse"></div>
        <h1 class="text-2xl font-bold text-white mb-2">Real-Time Activity AI</h1>
        <p class="text-slate-500 text-sm mb-8">WebSocket connected to Frankfurt</p>

        <div class="bg-slate-950 rounded-2xl p-8 mb-8 border border-slate-800">
            <p class="text-xs text-slate-500 uppercase tracking-widest mb-2">Current State</p>
            <div id="activityDisplay" class="text-4xl font-black text-indigo-400">WAITING</div>
            
            <div class="mt-6 flex justify-around text-xs font-mono text-slate-500">
                <span id="accelX">X: 0.00</span>
                <span id="accelY">Y: 0.00</span>
                <span id="accelZ">Z: 0.00</span>
            </div>
        </div>

        <button id="startBtn" onclick="startSensors()" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-4 rounded-xl shadow-lg transition-all">
            Connect Phone Sensors
        </button>

    </div>

    <script>
        // Use WSS (WebSocket Secure) instead of HTTPS
        const WS_URL = "wss://har-machine-learning-api.onrender.com/ws/stream";
        let socket;
        let sensorInterval;
        
        // Variables to hold the raw physical movement
        let currentX = 0, currentY = 0, currentZ = 0;

        function connectWebSocket() {
            socket = new WebSocket(WS_URL);

            socket.onopen = () => {
                document.getElementById('statusDot').className = "h-4 w-4 bg-emerald-500 rounded-full mx-auto mb-4 animate-pulse";
                document.getElementById('activityDisplay').innerText = "LINK ESTABLISHED";
            };

            socket.onmessage = (event) => {
                const data = JSON.parse(event.data);
                if(data.activity) {
                    document.getElementById('activityDisplay').innerText = data.activity;
                    // Flash green on new data
                    document.getElementById('activityDisplay').className = "text-4xl font-black text-emerald-400 transition-colors";
                    setTimeout(() => {
                        document.getElementById('activityDisplay').className = "text-4xl font-black text-indigo-400 transition-colors";
                    }, 200);
                }
            };

            socket.onclose = () => {
                document.getElementById('statusDot').className = "h-4 w-4 bg-red-500 rounded-full mx-auto mb-4";
                document.getElementById('activityDisplay').innerText = "DISCONNECTED";
            };
        }

        async function startSensors() {
            // iOS 13+ requires explicit permission for motion sensors
            if (typeof DeviceMotionEvent.requestPermission === 'function') {
                try {
                    const permissionState = await DeviceMotionEvent.requestPermission();
                    if (permissionState === 'granted') {
                        listenToHardware();
                    } else {
                        alert("Sensor access denied.");
                        return;
                    }
                } catch (error) {
                    console.error(error);
                }
            } else {
                // Non-iOS devices usually don't need explicit permission
                listenToHardware();
            }

            document.getElementById('startBtn').style.display = 'none';
            connectWebSocket();
        }

        function listenToHardware() {
            // Read the physical accelerometer
            window.addEventListener('devicemotion', (event) => {
                currentX = event.accelerationIncludingGravity.x || 0;
                currentY = event.accelerationIncludingGravity.y || 0;
                currentZ = event.accelerationIncludingGravity.z || 0;

                // Update UI
                document.getElementById('accelX').innerText = `X: ${currentX.toFixed(2)}`;
                document.getElementById('accelY').innerText = `Y: ${currentY.toFixed(2)}`;
                document.getElementById('accelZ').innerText = `Z: ${currentZ.toFixed(2)}`;
            });

            // Stream data to Frankfurt every 200ms (5 times a second)
            sensorInterval = setInterval(() => {
                if (socket && socket.readyState === WebSocket.OPEN) {
                    
                    // We grab the real phone X, Y, Z, and pad the remaining 31 features with 0 
                    // so your specific ML model doesn't crash on size mismatch.
                    let featureArray = [currentX, currentY, currentZ];
                    while(featureArray.length < 34) {
                        featureArray.push(0.0);
                    }

                    socket.send(JSON.stringify({ "features": featureArray }));
                }
            }, 200);
        }
    </script>
</body>
</html>
