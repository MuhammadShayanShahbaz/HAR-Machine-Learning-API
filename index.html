<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HAR | Edge Computing Stream</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Custom scrollbar and animations for a polished feel */
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }
        .glass-panel { background: rgba(15, 23, 42, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(51, 65, 85, 0.5); }
    </style>
</head>
<body class="bg-slate-950 text-slate-200 font-sans min-h-screen flex flex-col items-center justify-center p-4 md:p-6 bg-[radial-gradient(ellipse_at_top_right,_var(--tw-gradient-stops))] from-slate-900 via-slate-950 to-black">

    <div class="max-w-md w-full glass-panel rounded-3xl p-8 text-center shadow-2xl relative overflow-hidden">
        
        <div class="absolute top-6 right-6 flex items-center gap-2">
            <span id="networkText" class="text-xs font-mono text-slate-500 uppercase tracking-widest">Offline</span>
            <div id="statusDot" class="h-3 w-3 bg-red-500 rounded-full shadow-[0_0_10px_rgba(239,68,68,0.6)] transition-colors duration-300"></div>
        </div>

        <h1 class="text-2xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-indigo-400 to-cyan-400 mb-2 mt-4">
            Edge Intelligence
        </h1>
        <p class="text-slate-400 text-sm mb-8 font-medium">Local feature extraction & cloud telemetry</p>

        <div class="bg-slate-900/80 rounded-2xl p-6 mb-8 border border-slate-800 shadow-inner">
            <p class="text-[10px] text-slate-500 uppercase tracking-widest mb-3 font-semibold">Inference Engine Output</p>
            <div id="activityDisplay" class="text-3xl font-black text-slate-600 tracking-tight transition-all duration-300">
                STANDBY
            </div>
            
            <div class="mt-6 pt-4 border-t border-slate-800/50 flex justify-between items-center text-xs font-mono">
                <div class="text-slate-500 flex flex-col items-start">
                    <span class="uppercase text-[9px] tracking-wider mb-1">Processor State</span>
                    <span id="calcMsg" class="text-cyan-500 font-semibold">Awaiting Sensor Hook</span>
                </div>
                <div class="text-right flex flex-col items-end">
                    <span class="uppercase text-[9px] text-slate-500 tracking-wider mb-1">Buffer Memory</span>
                    <span id="bufferStatus" class="text-slate-300">0 / 25</span>
                </div>
            </div>
        </div>

        <button id="startBtn" onclick="SystemController.initialize()" class="w-full bg-gradient-to-r from-indigo-600 to-blue-600 hover:from-indigo-500 hover:to-blue-500 text-white font-bold py-4 rounded-xl shadow-[0_0_20px_rgba(79,70,229,0.3)] hover:shadow-[0_0_25px_rgba(79,70,229,0.5)] active:scale-[0.98] transition-all duration-200">
            Initialize Sensor Array
        </button>
    </div>

    <script>
        const CONFIG = {
            WS_URL: "wss://har-machine-learning-api.onrender.com/ws/stream",
            BUFFER_SIZE: 25,
            TICK_RATE_MS: 500,
            MAX_RECONNECT_ATTEMPTS: 5
        };

        // --- CORE MATH & EDGE COMPUTING ENGINE ---
        class EdgeProcessor {
            constructor(windowSize) {
                this.buffer = [];
                this.windowSize = windowSize;
            }

            pushTelemetry(ax, ay, az, gx, gy, gz) {
                this.buffer.push({ ax, ay, az, gx, gy, gz });
                if (this.buffer.length > this.windowSize) {
                    this.buffer.shift(); // O(1) Queue behavior
                }
                UI.updateBufferCount(this.buffer.length, this.windowSize);
            }

            isReady() {
                return this.buffer.length === this.windowSize;
            }

            extractFeatures() {
                if (!this.isReady()) return null;

                // O(n) Extraction - Loop exactly once instead of 6 separate maps
                let ax = [], ay = [], az = [], gx = [], gy = [], gz = [];
                for (let i = 0; i < this.windowSize; i++) {
                    const b = this.buffer[i];
                    ax.push(b.ax); ay.push(b.ay); az.push(b.az);
                    gx.push(b.gx); gy.push(b.gy); gz.push(b.gz);
                }

                // Precision Math Helpers
                const mean = arr => arr.reduce((a, b) => a + b, 0) / (arr.length || 1);
                const std = (arr, m) => Math.sqrt(arr.reduce((a, b) => a + Math.pow(b - m, 2), 0) / (arr.length || 1));
                const jerk = arr => { let j = []; for(let i=1; i<arr.length; i++) j.push(arr[i]-arr[i-1]); return j; };
                const mag = (x, y, z) => { let m = []; for(let i=0; i<x.length; i++) m.push(Math.sqrt(x[i]**2 + y[i]**2 + z[i]**2)); return m; };

                // Normalization Constants
                const MAX_A = 6.0; const MAX_G = 4.0; const MAX_J = 10.0;
                const normMean = (val, max) => Math.max(-1, Math.min(1, val / max));
                const normPos = (val, max) => Math.max(-1, Math.min(1, (val / max) * 2 - 1));

                // 1. Raw Means
                let r_m_ax = mean(ax), r_m_ay = mean(ay), r_m_az = mean(az);
                let r_m_gx = mean(gx), r_m_gy = mean(gy), r_m_gz = mean(gz);

                // 2. Normalized Means + Baseline Gravity Compensation
                let m_ax = normMean(r_m_ax, MAX_A) + 0.27;
                let m_ay = normMean(r_m_ay, MAX_A) - 0.01;
                let m_az = normMean(r_m_az, MAX_A) - 0.10;
                let m_gx = normMean(r_m_gx, MAX_G);
                let m_gy = normMean(r_m_gy, MAX_G) - 0.04;
                let m_gz = normMean(r_m_gz, MAX_G) + 0.09;

                // 3. Normalized Standard Deviations
                let s_ax = normPos(std(ax, r_m_ax), MAX_A), s_ay = normPos(std(ay, r_m_ay), MAX_A), s_az = normPos(std(az, r_m_az), MAX_A);
                let s_gx = normPos(std(gx, r_m_gx), MAX_G), s_gy = normPos(std(gy, r_m_gy), MAX_G), s_gz = normPos(std(gz, r_m_gz), MAX_G);

                // 4. Jerk (Derivative of Acceleration)
                let jx = jerk(ax), jy = jerk(ay), jz = jerk(az);
                let r_m_jx = mean(jx), r_m_jy = mean(jy), r_m_jz = mean(jz);
                
                let m_jx = normMean(r_m_jx, MAX_J), m_jy = normMean(r_m_jy, MAX_J), m_jz = normMean(r_m_jz, MAX_J);
                let s_jx = normPos(std(jx, r_m_jx), MAX_J), s_jy = normPos(std(jy, r_m_jy), MAX_J), s_jz = normPos(std(jz, r_m_jz), MAX_J);

                // 5. Signal Magnitude Area
                let aMag = mag(ax, ay, az), gMag = mag(gx, gy, gz);
                let m_aMag = normPos(mean(aMag), MAX_A), s_aMag = normPos(std(aMag, mean(aMag)), MAX_A);
                let m_gMag = normPos(mean(gMag), MAX_G), s_gMag = normPos(std(gMag, mean(gMag)), MAX_G);

                // Construct and precisely format 34-feature payload (Floats to 6 decimals)
                const rawFeatures = [
                    m_ax, m_ay, m_az, s_ax, s_ay, s_az,  
                    m_gx, m_gy, m_gz, s_gx, s_gy, s_gz,  
                    m_jx, m_jy, m_jz, s_jx, s_jy, s_jz,  
                    m_ax, m_ay, m_az, s_ax, s_ay, s_az, 
                    m_gx, m_gy, m_gz, s_gx, s_gy, s_gz,  
                    m_aMag, s_aMag, m_gMag, s_gMag       
                ];

                return rawFeatures.map(f => parseFloat(f.toFixed(6)));
            }
        }

        // --- DOM MANIPULATION & UI STATE ---
        const UI = {
            setDisplay: (text, colorClass) => {
                const el = document.getElementById('activityDisplay');
                el.innerText = text;
                el.className = `text-3xl font-black tracking-tight transition-all duration-300 ${colorClass}`;
            },
            setNetworkStatus: (status, color) => {
                document.getElementById('networkText').innerText = status;
                document.getElementById('statusDot').className = `h-3 w-3 rounded-full shadow-[0_0_10px_${color}] bg-${color.replace('rgba(','').split(',')[0]}-500`;
                if(status === 'Connected') document.getElementById('statusDot').classList.add('bg-emerald-500');
                else if(status === 'Reconnecting...') document.getElementById('statusDot').classList.add('bg-yellow-500', 'animate-ping');
                else document.getElementById('statusDot').classList.add('bg-red-500');
            },
            updateBufferCount: (current, max) => {
                document.getElementById('bufferStatus').innerText = `${current} / ${max}`;
            },
            setProcessorState: (msg, isStreaming = false) => {
                const el = document.getElementById('calcMsg');
                el.innerText = msg;
                el.className = isStreaming ? "text-emerald-400 font-semibold animate-pulse" : "text-cyan-500 font-semibold";
            },
            hideButton: () => document.getElementById('startBtn').style.display = 'none'
        };

        // --- SYSTEM CONTROLLER (The Brain) ---
        const SystemController = {
            socket: null,
            processor: new EdgeProcessor(CONFIG.BUFFER_SIZE),
            reconnectAttempts: 0,
            intervalId: null,

            async initialize() {
                // Request Hardware Permissions securely
                if (typeof DeviceMotionEvent.requestPermission === 'function') {
                    try {
                        const permissionState = await DeviceMotionEvent.requestPermission();
                        if (permissionState !== 'granted') {
                            alert("CRITICAL: Accelerometer access denied. System halted.");
                            return;
                        }
                    } catch (error) { 
                        console.error("Hardware Handshake Error:", error); 
                        return;
                    }
                }
                
                UI.hideButton();
                this.connectTelemetry();
                this.hookSensors();
                this.startEngine();
            },

            connectTelemetry() {
                UI.setNetworkStatus("Connecting...", "rgba(234,179,8,0.6)"); // Yellow
                this.socket = new WebSocket(CONFIG.WS_URL);

                this.socket.onopen = () => {
                    this.reconnectAttempts = 0;
                    UI.setNetworkStatus("Connected", "rgba(16,185,129,0.6)"); // Emerald
                };

                this.socket.onmessage = (event) => {
                    try {
                        const data = JSON.parse(event.data);
                        if(data.activity) {
                            UI.setDisplay(data.activity, "text-emerald-400");
                            // Brief pulse to indigo to show processing loop completed
                            setTimeout(() => UI.setDisplay(data.activity, "text-indigo-400"), 250);
                        }
                    } catch (e) {
                        console.warn("Telemetry Parse Error");
                    }
                };

                this.socket.onclose = () => {
                    if (this.reconnectAttempts < CONFIG.MAX_RECONNECT_ATTEMPTS) {
                        this.reconnectAttempts++;
                        UI.setNetworkStatus("Reconnecting...", "rgba(234,179,8,0.6)");
                        setTimeout(() => this.connectTelemetry(), 2000 * this.reconnectAttempts); // Exponential backoff
                    } else {
                        UI.setNetworkStatus("Offline", "rgba(239,68,68,0.6)");
                        UI.setDisplay("CONNECTION LOST", "text-red-500");
                    }
                };
            },

            hookSensors() {
                window.addEventListener('devicemotion', (event) => {
                    const ax = event.acceleration.x || 0;
                    const ay = event.acceleration.y || 0;
                    const az = event.acceleration.z || 0;
                    const gx = event.rotationRate ? (event.rotationRate.alpha || 0) : 0;
                    const gy = event.rotationRate ? (event.rotationRate.beta || 0) : 0;
                    const gz = event.rotationRate ? (event.rotationRate.gamma || 0) : 0;

                    this.processor.pushTelemetry(ax, ay, az, gx, gy, gz);
                });
            },

            startEngine() {
                if (this.intervalId) clearInterval(this.intervalId);
                
                this.intervalId = setInterval(() => {
                    if (!this.processor.isReady()) {
                        UI.setProcessorState("Aggregating Memory...");
                        return;
                    }

                    const features = this.processor.extractFeatures();
                    
                    if (features && this.socket && this.socket.readyState === WebSocket.OPEN) {
                        UI.setProcessorState("Streaming Tensor Array", true);
                        this.socket.send(JSON.stringify({ "features": features }));
                    } else {
                        UI.setProcessorState("Awaiting Telemetry Link...", false);
                    }
                }, CONFIG.TICK_RATE_MS);
            }
        };
    </script>
</body>
</html>
