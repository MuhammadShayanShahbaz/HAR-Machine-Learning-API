<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HAR | Edge Computing Stream</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-200 font-sans min-h-screen flex flex-col items-center justify-center p-6">

    <div class="max-w-md w-full bg-slate-900 border border-slate-800 rounded-3xl p-8 text-center shadow-2xl">
        
        <div id="statusDot" class="h-4 w-4 bg-red-500 rounded-full mx-auto mb-4 animate-pulse"></div>
        <h1 class="text-2xl font-bold text-white mb-2">Real-Time Edge AI</h1>
        <p class="text-slate-500 text-sm mb-8">Processing features locally, streaming to Frankfurt</p>

        <div class="bg-slate-950 rounded-2xl p-8 mb-8 border border-slate-800">
            <p class="text-xs text-slate-500 uppercase tracking-widest mb-2">Predicted Activity</p>
            <div id="activityDisplay" class="text-3xl font-black text-indigo-400">WAITING...</div>
            
            <div class="mt-6 flex justify-around text-xs font-mono text-slate-500">
                <span id="calcMsg">Buffer Empty</span>
            </div>
        </div>

        <button id="startBtn" onclick="startSensors()" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-4 rounded-xl shadow-lg transition-all">
            Connect & Start Edge Processing
        </button>

    </div>

    <script>
        const WS_URL = "wss://har-machine-learning-api.onrender.com/ws/stream";
        let socket;

        // --- THE UPGRADED EDGE COMPUTING ENGINE ---
        class FeatureExtractor {
            constructor() {
                this.buffer = [];
                this.windowSize = 25; // Store 25 readings (~1 second window)
            }

            addReading(accX, accY, accZ, gyroX, gyroY, gyroZ) {
                this.buffer.push({ ax: accX, ay: accY, az: accZ, gx: gyroX, gy: gyroY, gz: gyroZ });
                if (this.buffer.length > this.windowSize) this.buffer.shift();
            }

            getFeatures() {
                if (this.buffer.length < this.windowSize) return null;

                let ax = this.buffer.map(d => d.ax), ay = this.buffer.map(d => d.ay), az = this.buffer.map(d => d.az);
                let gx = this.buffer.map(d => d.gx), gy = this.buffer.map(d => d.gy), gz = this.buffer.map(d => d.gz);

                // Math Helper Functions
                const mean = arr => arr.reduce((a, b) => a + b, 0) / arr.length;
                const std = (arr, m) => Math.sqrt(arr.reduce((a, b) => a + Math.pow(b - m, 2), 0) / arr.length);
                const jerk = arr => { let j = []; for(let i=1; i<arr.length; i++) j.push(arr[i]-arr[i-1]); return j; };
                const mag = (x, y, z) => { let m = []; for(let i=0; i<x.length; i++) m.push(Math.sqrt(x[i]**2 + y[i]**2 + z[i]**2)); return m; };

                // --- THE NORMALIZATION FIX ---
                // The AI expects features squished between -1 and 1. 
                // Zero physical movement MUST be mathematically mapped to -1.0!
                const normMean = (val, max) => Math.max(-1, Math.min(1, val / max));
                const normPositive = (val, max) => Math.max(-1, Math.min(1, (val / max) * 2 - 1)); // Maps 0 -> -1

                const MAX_A = 6.0; // Max expected acceleration
                const MAX_G = 4.0; // Max expected gyro
                const MAX_J = 10.0; // Max expected jerk

                // 1. Raw Means
                let r_m_ax = mean(ax), r_m_ay = mean(ay), r_m_az = mean(az);
                let r_m_gx = mean(gx), r_m_gy = mean(gy), r_m_gz = mean(gz);

                // 2. Normalized Means + UCI Dataset Baseline Offsets
                // The dataset has a constant gravity leakage offset. We inject it here so the AI recognizes "Resting".
                let m_ax = normMean(r_m_ax, MAX_A) + 0.27;
                let m_ay = normMean(r_m_ay, MAX_A) - 0.01;
                let m_az = normMean(r_m_az, MAX_A) - 0.10;
                let m_gx = normMean(r_m_gx, MAX_G);
                let m_gy = normMean(r_m_gy, MAX_G) - 0.04;
                let m_gz = normMean(r_m_gz, MAX_G) + 0.09;

                // 3. Standard Deviations (Using normPositive so 0 physical movement maps to -1)
                let s_ax = normPositive(std(ax, r_m_ax), MAX_A), s_ay = normPositive(std(ay, r_m_ay), MAX_A), s_az = normPositive(std(az, r_m_az), MAX_A);
                let s_gx = normPositive(std(gx, r_m_gx), MAX_G), s_gy = normPositive(std(gy, r_m_gy), MAX_G), s_gz = normPositive(std(gz, r_m_gz), MAX_G);

                // 4. Jerk (Change in acceleration over time)
                let jx = jerk(ax), jy = jerk(ay), jz = jerk(az);
                let r_m_jx = mean(jx), r_m_jy = mean(jy), r_m_jz = mean(jz);
                
                let m_jx = normMean(r_m_jx, MAX_J), m_jy = normMean(r_m_jy, MAX_J), m_jz = normMean(r_m_jz, MAX_J);
                let s_jx = normPositive(std(jx, r_m_jx), MAX_J), s_jy = normPositive(std(jy, r_m_jy), MAX_J), s_jz = normPositive(std(jz, r_m_jz), MAX_J);

                // 5. Magnitude
                let aMag = mag(ax, ay, az), gMag = mag(gx, gy, gz);
                let m_aMag = normPositive(mean(aMag), MAX_A), s_aMag = normPositive(std(aMag, mean(aMag)), MAX_A);
                let m_gMag = normPositive(mean(gMag), MAX_G), s_gMag = normPositive(std(gMag, mean(gMag)), MAX_G);

                // Construct the exact 34-Feature Array expected by the AI
                return [
                    m_ax, m_ay, m_az, s_ax, s_ay, s_az,  
                    m_gx, m_gy, m_gz, s_gx, s_gy, s_gz,  
                    m_jx, m_jy, m_jz, s_jx, s_jy, s_jz,  
                    m_ax, m_ay, m_az, s_ax, s_ay, s_az,  // Reusing normalized time-domain for freq-domain approximations
                    m_gx, m_gy, m_gz, s_gx, s_gy, s_gz,  
                    m_aMag, s_aMag, m_gMag, s_gMag       
                ];
            }
        }

        const edgeComputer = new FeatureExtractor();

        function connectWebSocket() {
            socket = new WebSocket(WS_URL);
            socket.onopen = () => {
                document.getElementById('statusDot').className = "h-4 w-4 bg-emerald-500 rounded-full mx-auto mb-4 animate-pulse";
            };
            socket.onmessage = (event) => {
                const data = JSON.parse(event.data);
                if(data.activity) {
                    document.getElementById('activityDisplay').innerText = data.activity;
                    document.getElementById('activityDisplay').className = "text-3xl font-black text-emerald-400";
                    setTimeout(() => document.getElementById('activityDisplay').className = "text-3xl font-black text-indigo-400", 200);
                }
            };
        }

        async function startSensors() {
            if (typeof DeviceMotionEvent.requestPermission === 'function') {
                try {
                    const permissionState = await DeviceMotionEvent.requestPermission();
                    if (permissionState !== 'granted') return alert("Sensor access denied.");
                } catch (error) { console.error(error); }
            }
            
            document.getElementById('startBtn').style.display = 'none';
            connectWebSocket();

            // Listen to Phone Hardware (Without Gravity)
            window.addEventListener('devicemotion', (event) => {
                let ax = event.acceleration.x || 0;
                let ay = event.acceleration.y || 0;
                let az = event.acceleration.z || 0;
                
                let gx = event.rotationRate ? (event.rotationRate.alpha || 0) : 0;
                let gy = event.rotationRate ? (event.rotationRate.beta || 0) : 0;
                let gz = event.rotationRate ? (event.rotationRate.gamma || 0) : 0;

                edgeComputer.addReading(ax, ay, az, gx, gy, gz);
            });

            // Every 500ms, extract features and send to cloud
            setInterval(() => {
                let features = edgeComputer.getFeatures();
                if (features) {
                    document.getElementById('calcMsg').innerText = "Streaming 34 features...";
                    if (socket && socket.readyState === WebSocket.OPEN) {
                        socket.send(JSON.stringify({ "features": features }));
                    }
                } else {
                    document.getElementById('calcMsg').innerText = "Filling Buffer...";
                }
            }, 500);
        }
    </script>
</body>
</html>
